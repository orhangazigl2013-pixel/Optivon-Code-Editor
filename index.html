<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <style>
        html, body, #editor {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #141414;
        }
    </style>
    <!-- pnpm ile inen yerel ace-builds dosyaları -->
    <script src="./node_modules/ace-builds/src-noconflict/ace.js"></script>
    <script src="./node_modules/ace-builds/src-noconflict/ext-language_tools.js"></script>
    <script src="./node_modules/ace-builds/src-noconflict/theme-twilight.js"></script>
    <script src="./node_modules/ace-builds/src-noconflict/mode-c_cpp.js"></script>
</head>
<body>

<div id="editor">// Optivon Code Editor (Local Ace Edition)
#include <iostream>

int main() {
    std::cout << "Hello Optivon!" << std::endl;
    return 0;
}</div>

<script>
    ace.require('ace/ext/language_tools');
    var editor = ace.edit('editor');
    editor.setTheme('ace/theme/twilight');
    editor.session.setMode('ace/mode/c_cpp');
    editor.setFontSize(14);
    editor.setShowPrintMargin(false);
    
    editor.setOptions({
        enableBasicAutocompletion: true,
        enableLiveAutocompletion: true,
        enableSnippets: true
    });

    function getEditorContent() { 
        return editor.getValue(); 
    }

    function setEditorContent(code, mode) {
        editor.setValue(code, -1);
        if (mode) {
            editor.session.setMode('ace/mode/' + mode);
        }
    }

    // Ctrl + S ile C# tarafına kaydet bildirimi gönder
    editor.commands.addCommand({
        name: 'saveFile',
        bindKey: {win: 'Ctrl-S', mac: 'Command-S'},
        exec: function(ed) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage('save');
            }
        }
    });
</script>

</body>
</html>
